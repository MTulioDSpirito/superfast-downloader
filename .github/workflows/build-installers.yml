# build-installers.yml — compila os instaladores e publica um GitHub Release.
#
# Disparadores:
#   - push de tag v*      -> monta Windows (.exe) + macOS (.dmg) e cria a release
#   - workflow_dispatch   -> monta e sobe os artefatos (baixe na pagina do run;
#                            sem tag nao cria release, pra nao conflitar)
#
# O Windows e compilado pelo MESMO build_windows.ps1 usado localmente.

name: build-installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Ler versao do .iss
        run: |
          ver=$(grep -oE 'MyAppVersion[[:space:]]+"[^"]+"' installer/windows/superfastdm.iss | sed -E 's/.*"(.*)"/\1/')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Versao: $ver"

  windows:
    runs-on: windows-latest
    needs: meta
    steps:
      - uses: actions/checkout@v4
      - name: Compilar instalador Windows (Inno Setup)
        shell: pwsh
        run: ./installer/windows/build_windows.ps1
      - name: Upload artefato (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: SuperFastDM-windows
          if-no-files-found: error
          path: |
            installer/windows/output/SuperFastDM-Setup-${{ needs.meta.outputs.version }}.exe
            installer/windows/output/SuperFastDM-Setup-${{ needs.meta.outputs.version }}.exe.sha256

  macos:
    runs-on: macos-latest
    needs: meta
    steps:
      - uses: actions/checkout@v4
      - name: Compilar .dmg (macOS)
        run: bash installer/mac/build-app.sh --dmg
      - name: sha256
        run: |
          cd installer/mac/build
          shasum -a 256 SuperFastDM.dmg > SuperFastDM.dmg.sha256
      - name: Upload artefato (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: SuperFastDM-macos
          if-no-files-found: error
          path: |
            installer/mac/build/SuperFastDM.dmg
            installer/mac/build/SuperFastDM.dmg.sha256

  release:
    runs-on: ubuntu-latest
    needs: [meta, windows, macos]
    if: github.event_name == 'push'
    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SuperFast DM ${{ needs.meta.outputs.version }}
          generate_release_notes: true
          files: |
            dist/SuperFastDM-windows/*.exe
            dist/SuperFastDM-windows/*.sha256
            dist/SuperFastDM-macos/*.dmg
            dist/SuperFastDM-macos/*.sha256
